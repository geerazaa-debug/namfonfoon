nasa:
  # EONET v3: near-real-time natural event feed (no key required)
  eonet_url: https://eonet.gsfc.nasa.gov/api/v3/events
  # CMR: Earthdata metadata search (no key required for search)
  cmr_granules_url: https://cmr.earthdata.nasa.gov/search/granules.json
  # MODIS/LANCE NRT Global Flood Product (MCDWD_L3_NRT)
  flood_collection_short_name: MCDWD_L3_NRT
  timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0

local_sensors:
  timeout_s: 10
  max_retries: 3

# Area of interest: Greater Bangkok (lat/lon WGS84)
area_of_interest:
  name: Greater Bangkok
  min_lat: 13.40
  max_lat: 14.10
  min_lon: 100.25
  max_lon: 100.95

polling:
  satellite_interval_min: 180
  sensor_interval_min: 10

geofence:
  default_radius_km: 2.0

line:
  push_url: https://api.line.me/v2/bot/message/push
  timeout_s: 10

thaiwater:
  # Latest rain_1h + rain_24h for all ThaiWater stations (~4.6 MB, updated hourly)
  rain_url: https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h
  timeout_s: 60
  max_retries: 3

rain_pipeline:
  poll_interval_min: 15
  station_radius_km: 5        # use all stations within this distance of the user
  fallback_radius_km: 10      # else the nearest station within this distance
  min_hours_for_6h: 5         # of the 6 hourly slots; fewer -> rain_6h unknown (1h rule only)
  history_hours: 24

storage:
  db_path: data/floodwatch.db   # relative to project root; override with env FLOODWATCH_DB
