nasa:
  # EONET v3: near-real-time natural event feed (no key required)
  eonet_url: https://eonet.gsfc.nasa.gov/api/v3/events
  # CMR: Earthdata metadata search (no key required for search)
  cmr_granules_url: https://cmr.earthdata.nasa.gov/search/granules.json
  # MODIS/LANCE NRT Global Flood Product (MCDWD_L3_NRT)
  flood_collection_short_name: MCDWD_L3_NRT
  timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0

local_sensors:
  timeout_s: 10
  max_retries: 3

# Area of interest: Greater Bangkok (lat/lon WGS84)
area_of_interest:
  name: Greater Bangkok
  min_lat: 13.40
  max_lat: 14.10
  min_lon: 100.25
  max_lon: 100.95

polling:
  satellite_interval_min: 180
  sensor_interval_min: 10

geofence:
  default_radius_km: 2.0

line:
  push_url: https://api.line.me/v2/bot/message/push
  timeout_s: 10

thaiwater:
  # Latest rain_1h + rain_24h for all ThaiWater stations (~4.6 MB, updated hourly)
  rain_url: https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h
  timeout_s: 60
  max_retries: 3

rain_pipeline:
  poll_interval_min: 15
  station_radius_km: 5        # use all stations within this distance of the user
  fallback_radius_km: 10      # else the nearest station within this distance
  min_hours_for_6h: 5         # of the 6 hourly slots; fewer -> rain_6h unknown (1h rule only)
  history_hours: 24

storage:
  db_path: data/floodwatch.db   # relative to project root; override with env FLOODWATCH_DB

# Citizen water-level reports via LINE ("รายงานน้ำ"), shown on the public /map page
community_reports:
  reply_url: https://api.line.me/v2/bot/message/reply
  id_token_verify_url: https://api.line.me/oauth2/v2.1/verify   # LIFF page (/report) auth
  trigger_texts: ["รายงานน้ำ", "รายงาน", "report"]
  ttl_hours: 3                # a report disappears from the map after this
  pending_ttl_min: 10         # time between picking a level and sending the location
  coord_decimals: 3           # ~110 m: stored and published coordinates are rounded to this
  confirm_radius_m: 300       # other reporters within this distance can confirm a report
  confirm_min_reporters: 2    # distinct reporters (incl. the first) for "confirmed"
  max_reports_per_hour: 4     # per LINE user
  public_map_url: ""          # e.g. https://<host>/map; empty -> no link in replies
  levels:                     # rank 0 = water gone; quick-reply labels must stay <= 20 chars
    - {key: clear, rank: 0, emoji: "✅", label: "น้ำลดแล้ว", color: "#2E7D32"}
    - {key: ankle, rank: 1, emoji: "🦶", label: "ถึงตาตุ่ม", color: "#F9A825"}
    - {key: knee, rank: 2, emoji: "🦵", label: "ถึงเข่า", color: "#EF6C00"}
    - {key: waist, rank: 3, emoji: "🧍", label: "ถึงเอว", color: "#C62828"}

# Route check via LINE ("เช็คเส้นทาง"): measured gauge rain near a route + live citizen reports on it
route_check:
  trigger_texts: ["เช็คเส้นทาง", "เส้นทาง", "route"]
  # OSRM public demo server: car profile only, fair use (<= 1 req/s), no SLA. Also called by /map.
  osrm_url: https://router.project-osrm.org/route/v1/driving
  timeout_s: 15
  max_retries: 1
  pending_ttl_min: 10          # time between sharing the start point and the destination
  coord_decimals: 3            # start point is held this coarse, only until the destination arrives
  station_buffer_km: 3         # rain gauges within this distance of the route
  report_buffer_m: 300         # citizen reports within this distance of the route
  max_rain_age_min: 90         # older gauge readings are ignored
  warn_rain_mm: 10             # 1 h rain at any gauge on the route -> "warn"
  warn_report_rank: 2          # a report at this level rank or deeper (knee) -> "warn"
  rain_classes:                # by 1 h rain at a gauge; the highest matching min_mm wins
    - {key: light, min_mm: 0.5, emoji: "🌦️", label: "ฝนเล็กน้อย"}
    - {key: moderate, min_mm: 5, emoji: "🌧️", label: "ฝนปานกลาง"}
    - {key: heavy, min_mm: 10, emoji: "⛈️", label: "ฝนหนัก"}
    - {key: very_heavy, min_mm: 30, emoji: "🚨", label: "ฝนหนักมาก"}
