nasa:
  # EONET v3: near-real-time natural event feed (no key required)
  eonet_url: https://eonet.gsfc.nasa.gov/api/v3/events
  # CMR: Earthdata metadata search (no key required for search)
  cmr_granules_url: https://cmr.earthdata.nasa.gov/search/granules.json
  # MODIS/LANCE NRT Global Flood Product (MCDWD_L3_NRT)
  flood_collection_short_name: MCDWD_L3_NRT
  timeout_s: 20
  max_retries: 4
  backoff_base_s: 1.0

local_sensors:
  timeout_s: 10
  max_retries: 3

# User-facing identity. The public base URL (https://<domain>) comes from env PUBLIC_BASE_URL, which
# deploy/setup.sh writes from the deploy domain; without it replies carry no links.
project:
  name: "น้ำ ฝน ฝุ่น"
  contact_email: "namfonfoon.th@gmail.com"   # project mailbox shown on /privacy; "" -> LINE chat only
  privacy_updated: "2026-10-16"
  help_texts: ["วิธีใช้", "ช่วยเหลือ", "เมนู", "help", "สวัสดี"]
  my_data_texts: ["ข้อมูลของฉัน"]
  delete_texts: ["ลบข้อมูลของฉัน", "ลบข้อมูล"]

# Area of interest: Greater Bangkok (lat/lon WGS84)
area_of_interest:
  name: Greater Bangkok
  min_lat: 13.40
  max_lat: 14.10
  min_lon: 100.25
  max_lon: 100.95

polling:
  satellite_interval_min: 180
  sensor_interval_min: 10

geofence:
  default_radius_km: 2.0

line:
  push_url: https://api.line.me/v2/bot/message/push
  quota_url: https://api.line.me/v2/bot/message/quota
  consumption_url: https://api.line.me/v2/bot/message/quota/consumption
  timeout_s: 10
  # Pushes (rain alerts, owner notices) count against the plan's monthly quota; replies are free.
  # Counted locally per push (LINE's consumption figure lags); LINE's numbers are a cross-check.
  push_quota:
    fallback_limit: 300     # Thai free plan, used when the quota API is unreachable
    warn_pct: 80            # one notice to OWNER_LINE_USER_ID per month at this usage

thaiwater:
  # Latest rain_1h + rain_24h for all ThaiWater stations (~4.6 MB, updated hourly)
  rain_url: https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h
  timeout_s: 60
  max_retries: 3

rain_pipeline:
  poll_interval_min: 15
  station_radius_km: 5        # use all stations within this distance of the user
  fallback_radius_km: 10      # else the nearest station within this distance
  min_hours_for_6h: 5         # of the 6 hourly slots; fewer -> rain_6h unknown (1h rule only)
  history_hours: 24

storage:
  db_path: data/floodwatch.db   # relative to project root; override with env FLOODWATCH_DB

# Citizen water-level reports via LINE ("รายงานน้ำ"), shown on the public /map page
community_reports:
  reply_url: https://api.line.me/v2/bot/message/reply
  id_token_verify_url: https://api.line.me/oauth2/v2.1/verify   # LIFF page (/report) auth
  trigger_texts: ["รายงานน้ำ", "รายงาน", "report"]
  ttl_hours: 3                # a report disappears from the map after this
  pending_ttl_min: 10         # time between picking a level and sending the location
  coord_decimals: 3           # ~110 m: stored and published coordinates are rounded to this
  confirm_radius_m: 300       # other reporters within this distance can confirm a report
  confirm_min_reporters: 2    # distinct reporters (incl. the first) for "confirmed"
  max_reports_per_hour: 4     # per LINE user
  levels:                     # rank 0 = water gone; quick-reply labels must stay <= 20 chars
    - {key: clear, rank: 0, emoji: "✅", label: "น้ำลดแล้ว", color: "#2E7D32"}
    - {key: ankle, rank: 1, emoji: "🦶", label: "ถึงตาตุ่ม", color: "#F9A825"}
    - {key: knee, rank: 2, emoji: "🦵", label: "ถึงเข่า", color: "#EF6C00"}
    - {key: waist, rank: 3, emoji: "🧍", label: "ถึงเอว", color: "#C62828"}

# Route check via LINE ("เช็คเส้นทาง"): measured gauge rain near a route + live citizen reports on it
route_check:
  trigger_texts: ["เช็คเส้นทาง", "เส้นทาง", "route"]
  # OSRM public demo server: car profile only, fair use (<= 1 req/s), no SLA. Also called by /map.
  osrm_url: https://router.project-osrm.org/route/v1/driving
  timeout_s: 15
  max_retries: 1
  pending_ttl_min: 10          # time between sharing the start point and the destination
  coord_decimals: 3            # start point is held this coarse, only until the destination arrives
  station_buffer_km: 3         # rain gauges within this distance of the route
  report_buffer_m: 300         # citizen reports within this distance of the route
  max_rain_age_min: 90         # older gauge readings are ignored
  warn_rain_mm: 10             # 1 h rain at any gauge on the route -> "warn"
  warn_report_rank: 2          # a report at this level rank or deeper (knee) -> "warn"
  flood_buffer_m: 200          # BMA road flood sensors within this distance of the route
  min_flood_cm: 2              # sensor depth below this counts as dry (sensor noise)
  warn_flood_cm: 10            # any sensor on the route at this depth or more -> "warn"
  rain_classes:                # by 1 h rain at a gauge; the highest matching min_mm wins
    - {key: light, min_mm: 0.5, emoji: "🌦️", label: "ฝนเล็กน้อย"}
    - {key: moderate, min_mm: 5, emoji: "🌧️", label: "ฝนปานกลาง"}
    - {key: heavy, min_mm: 10, emoji: "⛈️", label: "ฝนหนัก"}
    - {key: very_heavy, min_mm: 30, emoji: "🚨", label: "ฝนหนักมาก"}

# PM2.5 via LINE ("ฝุ่น"), in route checks and on /map. Air4Thai (Pollution Control Department) already
# includes BMA's own sensors (stationType "BKK"): 59 Bangkok stations on 2026-10-16. Licence not stated:
# attribute, non-commercial public use only. Nationwide: unlike reports, nothing here is Bangkok-specific.
air_quality:
  url: https://air4thai.pcd.go.th/services/getNewAQI_JSON.php
  extra_ca: ca/letsencrypt_yr.pem   # under config/: their server sends a broken chain (checked 2026-10-16)
  timeout_s: 20
  max_retries: 2
  cache_min: 10                # Air4Thai updates hourly; one fetch serves every user this long
  max_age_min: 180             # stations whose latest reading is older are ignored
  nearest_max_km: 15           # no fresh station this close -> say so
  route_buffer_km: 2
  pending_ttl_min: 10
  trigger_texts: ["ฝุ่น", "ค่าฝุ่น", "pm2.5", "pm25", "ฝุ่นpm2.5"]   # matched lower-cased, spaces removed
  # Band = Air4Thai's own PM25 color_id per station (Thai AQI, PCD announcement B.E. 2566 / 2023:
  # PM2.5 0-15 / 15.1-25 / 25.1-37.5 / 37.6-75 / >75 ug/m3). Advice is a plain-language summary of PCD's
  # guidance; check it against the official announcement before launch.
  sensitive_group: "เด็ก ผู้สูงอายุ คนท้อง และผู้มีโรคประจำตัว"
  bands:
    - {id: 1, emoji: "🔵", label: "ดีมาก", color: "#3BCCFF",
       general: "อากาศดีมาก ทำกิจกรรมกลางแจ้งได้เต็มที่",
       sensitive: "ทำกิจกรรมกลางแจ้งได้ตามปกติ"}
    - {id: 2, emoji: "🟢", label: "ดี", color: "#92D050",
       general: "ทำกิจกรรมกลางแจ้งได้ตามปกติ",
       sensitive: "ทำกิจกรรมกลางแจ้งได้ตามปกติ"}
    - {id: 3, emoji: "🟡", label: "ปานกลาง", color: "#FFD600",
       general: "ทำกิจกรรมกลางแจ้งได้ตามปกติ",
       sensitive: "ถ้ามีอาการ เช่น ไอ หายใจลำบาก แสบตา ให้ลดเวลาอยู่กลางแจ้ง"}
    - {id: 4, emoji: "🟠", label: "เริ่มมีผลต่อสุขภาพ", color: "#FFA200",
       general: "ลดเวลาอยู่กลางแจ้ง ถ้าต้องออกไปให้ใส่หน้ากากกันฝุ่น (เช่น N95)",
       sensitive: "ลดหรืองดกิจกรรมกลางแจ้ง ใส่หน้ากากกันฝุ่น ถ้าไอ แน่นหน้าอก หรือหายใจลำบาก ให้รีบพบแพทย์"}
    - {id: 5, emoji: "🔴", label: "มีผลต่อสุขภาพ", color: "#F04646",
       general: "งดกิจกรรมกลางแจ้ง อยู่ในอาคารและปิดหน้าต่าง ถ้าต้องออกไปให้ใส่หน้ากากกันฝุ่น",
       sensitive: "อยู่ในอาคาร ใช้เครื่องฟอกอากาศถ้ามี ถ้ามีอาการผิดปกติให้รีบพบแพทย์"}

# python -m src.alerts.rich_menu (see that module); image: deploy/richmenu/richmenu.png
rich_menu:
  create_url: https://api.line.me/v2/bot/richmenu
  content_url: https://api-data.line.me/v2/bot/richmenu/{id}/content
  default_url: https://api.line.me/v2/bot/user/all/richmenu/{id}

# BMA Department of Drainage and Sewerage live data: the JSON the public map weather.bangkok.go.th calls
# itself (undocumented, licence not stated). Display only (route checks, /map), attributed, cached for all
# users; permission requested (docs/bma_data_request_draft.md). Stop using it if BMA asks.
bma_dds:
  rain_url: https://weather.bangkok.go.th/rain/PageMap/GetDataForUpdate   # POST; ~127 gauges, 5-min
  flood_url: https://weather.bangkok.go.th/Flood/PageMap/GetData?id=0     # GET; ~247 road depth sensors
  user_agent: "NamFonFoon/0.6 (free public service; +mailto:namfonfoon.th@gmail.com)"
  timeout_s: 30
  max_retries: 1
  cache_min: 5                 # at most 2 requests per 5 min, whatever the traffic
  max_age_min: 30              # older readings are ignored

# River / canal levels via LINE ("ระดับน้ำ") and on /map: ThaiWater waterlevel_load, Greater Bangkok box.
# Status = ThaiWater's own situation_level (consistent with % of bank: 3 = 30-70, 4 = 70-100, 5 = >100).
river_level:
  url: https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load
  timeout_s: 60
  max_retries: 2
  cache_min: 10
  max_age_min: 360            # the feed can lag hours at night; every line shows its age
  trigger_texts: ["ระดับน้ำ", "น้ำขึ้น", "แม่น้ำ", "เจ้าพระยา", "น้ำทะเลหนุน"]
  key_stations: ["CPY014", "C.12", "CPY015", "GLF001"]   # Chao Phraya north -> south: Nonthaburi .. river mouth
  nearest: 3                   # subscribers get this many stations nearest home
  levels:
    - {id: 1, emoji: "🟡", label: "น้ำน้อยวิกฤต", color: "#F9A825"}
    - {id: 2, emoji: "🟡", label: "น้ำน้อย", color: "#FBC02D"}
    - {id: 3, emoji: "🟢", label: "ปกติ", color: "#2E7D32"}
    - {id: 4, emoji: "🟠", label: "น้ำมาก", color: "#EF6C00"}
    - {id: 5, emoji: "🔴", label: "ล้นตลิ่ง", color: "#C62828"}
