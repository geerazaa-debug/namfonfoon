# Rule-based rain advisory thresholds. NOT a validated flood predictor.
# Step 4 backtest (docs/step4_backtest_result.md): no model beat rain-only, and rain-only
# itself was weak (PR-AUC 0.17 vs base rate 0.067). Expect many false alarms.

# Rolling 6 h accumulation (median DDS flood-event rain duration is 4 h).
# Anchored on BMA DDS recorded-flood event rainfall 2022-2025 (n=1,434):
# 90% / 75% / 50% of recorded road floods had at least this much rain.
rain_6h_mm:
  moderate: 36   # p10
  high: 49       # p25
  critical: 67   # p50

# 1 h intensity. 60 mm/h is the commonly cited BMA drainage design capacity (unverified).
rain_1h_mm:
  moderate: 10
  high: 30
  critical: 60

# Districts in the top quartile of DDS flood days (config/district_hotspots.json) are
# raised one level when rain is already at least moderate (never above critical).
hotspot_escalation: true

# Ignore rain observations older than this (no alert on stale data).
max_obs_age_min: 90

alerts:
  min_level_to_notify: high
  cooldown_min: 60   # applied by the alert dispatcher (not built yet)
