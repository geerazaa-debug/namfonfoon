  .stat span { font-size: 28px; color: var(--muted); }
  #progress { position: relative; margin-top: 34px; height: 10px; background: var(--panel); border-radius: 5px; }
  #progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mid); border-radius: 5px; }
  #ticks { position: relative; height: 40px; font-size: 26px; color: var(--muted); }
  #ticks span { position: absolute; top: 8px; transform: translateX(-50%); }
  #bars { position: absolute; left: 60px; right: 60px; top: 1290px; }

  .bar .n { width: 46px; color: var(--muted); }
  .bar .name { width: 250px; }

  #legend .grad { width: 260px; height: 16px; border-radius: 8px;

  #legend .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--hot); margin-left: 26px; }
  #closing { font-size: calc(50px * var(--ts, 1)); line-height: 1.45; padding: 0 70px; }
  #intro { top: 1330px; font-size: calc(40px * var(--ts, 1)); line-height: 1.6; color: var(--muted); padding: 0 90px; }
  #intro b { color: var(--ink); font-weight: 400; }
  #closing .em { color: var(--high); font-weight: 600; }
  #footer { bottom: 50px; font-size: calc(25px * var(--ts, 1)); line-height: 1.5; color: var(--muted); padding: 0 50px; }

  .hide { opacity: 0; }

  "closing3": "မြို့တော်စည်ပင် စစ်ဆေးထားသော လမ်းများသာ အကျုံးဝင်သည်။<br>မိုးတွင်းကာလတွင် BMA နှင့်<br>ထိုင်းမိုးလေဝသဌာန၏ သတိပေးချက်များကို စောင့်ကြည့်ပါ။",
  "footer1": "အတိတ်မှတ်တမ်းသာဖြစ်ပြီး ခန့်မှန်းချက် မဟုတ်ပါ",
  "footer2": "မြို့တော်စည်ပင် မှတ်တမ်းတင်ထားသော လမ်းများသာ",
  "footer3": "အရင်းအမြစ်: ဘန်ကောက်မြို့တော် (BMA) လမ်းရေကြီးမှုမှတ်တမ်းများ၊ data.bangkok.go.th (CC BY)",
  "footer4": "မြေပုံ: geoBoundaries (CC BY 3.0 IGO)"
 }
}
)[LANG]);
function fromJson(j) {
  const f = (s, o) => s.replace(/\{(\w)\}/g, (_, k) => o[k]);
  return {
    ...j, yearOffset: 0,
    fmtMonth: (m, y) => f(j.monthFmt, { m, y }), fmtDay: (d, m, y) => f(j.dayFmt, { d, m, y }),
    sub: (a, b) => f(j.sub, { a, b }), worstSub: (n) => f(j.worstSub, { n }),
    closing: (n, m) => `${f(j.closing1, { n, m })}<br><span class="em">${j.closing2}</span><br>` +
      `<span style="font-size:34px;color:var(--muted)">${j.closing3}</span>`,
    footer: `<b>${j.footer1}</b> · ${j.footer2}<br>${j.footer3}<br>${j.footer4}`,
    name: (d) => d.en,
  };
}
document.documentElement.lang = LANG;
// Scene boundaries are sized to the voice-over (narration.json uses the same times).
const DUR = 50;
const T_PLAY0 = 5.5, T_PLAY1 = 26, T_WORST1 = 33.8, T_TOP1 = 41.8;
const MONTHS = STR.months;
const PULSE_DAYS = 30;
const $ = (id) => document.getElementById(id);
const start = new Date(DATA.start + "T00:00:00");
const dayDate = (k) => new Date(start.getTime() + k * 86400000);
const fmtMonth = STR.fmtMonth || ((m, y) => `${m} ${y}`);
const fmtDay = STR.fmtDay || ((d, m, y) => `${d} ${m} ${y}`);
const thaiMonth = (k) => { const d = dayDate(k); return fmtMonth(MONTHS[d.getMonth()], d.getFullYear() + STR.yearOffset); };
const thaiDay = (k) => { const d = dayDate(k); return fmtDay(d.getDate(), MONTHS[d.getMonth()], d.getFullYear() + STR.yearOffset); };
document.title = STR.title;
$("intro").innerHTML = STR.intro; $("footer").innerHTML = STR.footer;
if (STR.scale) document.documentElement.style.setProperty("--ts", STR.scale);
// Closing text sits just above the footer, whatever the footer's height in this language.
$("closing").style.bottom = ($("footer").offsetHeight + 50 + 40) + "px";
$("lgLow").textContent = STR.low; $("lgHigh").textContent = STR.high; $("lgNow").textContent = STR.now;
$("s1l").textContent = STR.s1; $("s2l").textContent = STR.s2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const maxDays = Math.max(...DATA.districts.map((d) => d.days.length));
const ranked = DATA.districts.map((d, i) => ({ i, n: d.days.length })).sort((a, b) => b.n - a.n).slice(0, 10);
const worstSet = new Set(DATA.worstDistricts);

function hex(c) { return [1, 3, 5].map((o) => parseInt(c.slice(o, o + 2), 16)); }
function mix(a, b, t) { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, j) => Math.round(v + (y[j] - v) * t)).join(",") + ")"; }
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { low: css("--low"), mid: css("--mid"), high: css("--high"), pulse: css("--pulse"), hot: css("--hot"), bg: css("--bg") };
function scale(n) {
  if (n <= 0) return C.low;
  const t = Math.sqrt(n / maxDays);
  return t < .5 ? mix(C.low, C.mid, t * 2) : mix(C.mid, C.high, (t - .5) * 2);
}
function rgbMix(rgb, target, t) {
  const a = rgb.match(/\d+/g).map(Number), b = hex(target);
  return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * t)).join(",") + ")";
}

// Build the map and static pieces once.
const shapes = DATA.districts.map((d) => {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d.path);
  $("shapes").appendChild(p);
  return p;
});
const labels = ranked.map((r, j) => {
  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  const d = DATA.districts[r.i];
  t.setAttribute("x", d.cx); t.setAttribute("y", d.cy + 8);
  t.textContent = `${j + 1}`;
  $("labels").appendChild(t);
  return t;
});
const firstYear = start.getFullYear() + 1;
for (let y = firstYear; ; y++) {
  const k = (new Date(`${y}-01-01T00:00:00`) - start) / 86400000;
  if (k > DATA.totalDays) break;
  const s = document.createElement("span");
  s.style.left = (k / DATA.totalDays * 100) + "%";
  s.textContent = y + STR.yearOffset;
  $("ticks").appendChild(s);
}
$("bars").innerHTML = ranked.map((r, j) => `<div class="bar"><span class="n">${j + 1}</span><span class="name">${STR.name(DATA.districts[r.i])}</span>` +
  `<span class="track"><span class="fill"></span></span><span class="v">${r.n}</span></div>`).join("");
const fills = [...document.querySelectorAll(".bar .fill")];
const bars = [...document.querySelectorAll(".bar")];

function countUpTo(days, k) { let c = 0; for (const x of days) { if (x <= k) c++; else break; } return c; }

function renderAt(t) {
  t = clamp(t, 0, DUR);
  const play = clamp((t - T_PLAY0) / (T_PLAY1 - T_PLAY0));
  const simDay = t < T_PLAY0 ? -1 : play * DATA.totalDays;
  const inWorst = t >= T_PLAY1 && t < T_WORST1, inTop = t >= T_WORST1 && t < T_TOP1, inEnd = t >= T_TOP1;

  // header
  let title = STR.title, sub = STR.sub(thaiMonth(0), thaiMonth(DATA.totalDays));
  if (inWorst) { title = STR.worstTitle; sub = STR.worstSub(Math.round(ease((t - T_PLAY1) / 1.5) * DATA.worstDistricts.length)); }
  if (inTop) { title = STR.topTitle; sub = STR.topSub; }
  if (inEnd) { title = STR.endTitle; sub = ""; }
  $("title").textContent = title; $("subtitle").textContent = sub;
  $("title").style.opacity = t < .6 ? ease(t / .6) : 1;

  // map colours
  const mapIn = ease(t / 1.2);
  DATA.districts.forEach((d, i) => {
    const n = simDay < 0 ? 0 : countUpTo(d.days, simDay);
    let col = scale(n);
    if (t >= T_PLAY0 && t < T_PLAY1) {
      let pulse = 0;
      for (const k of d.days) { const age = simDay - k; if (age >= 0 && age < PULSE_DAYS) pulse = Math.max(pulse, 1 - age / PULSE_DAYS); }
      if (pulse > 0) col = rgbMix(col, C.hot, .9 * pulse);
    }
    if (inWorst) {
      const on = ease((t - T_PLAY1) / 1.2);
      col = worstSet.has(i) ? rgbMix(scale(d.days.length), C.hot, on) : rgbMix(scale(d.days.length), C.bg, .6 * on);
    }
    if (inTop) {
      const isTop = ranked.some((r) => r.i === i);
      col = isTop ? scale(d.days.length) : rgbMix(scale(d.days.length), C.bg, .65 * ease((t - T_WORST1) / 1));
    }
    if (inEnd) col = rgbMix(scale(d.days.length), C.bg, .75 * ease((t - T_TOP1) / 1));
    shapes[i].style.fill = col;
  });
  $("map").style.opacity = mapIn;
  $("intro").style.opacity = t < T_PLAY0 - .8 ? ease((t - .8) / .8) : 1 - ease((t - T_PLAY0 + .8) / .6);
  labels.forEach((l, j) => { l.style.opacity = inTop ? ease((t - T_WORST1 - j * .12) / .5) : 0; });

  // timeline panel
  const showPanel = t >= T_PLAY0 - .8 && t < T_PLAY1 + 6;
  $("panel").style.opacity = t < T_PLAY0 ? ease((t - T_PLAY0 + .8) / .8) : (t < T_WORST1 - .6 ? 1 : 1 - ease((t - T_WORST1 + .6) / .6));
  $("panel").style.visibility = showPanel ? "visible" : "hidden";
  const k = inWorst ? DATA.worstDay : Math.max(0, simDay);
  $("date").textContent = inWorst ? thaiDay(DATA.worstDay) : thaiMonth(Math.min(k, DATA.totalDays));
  if (!inWorst) {
    let fd = 0, dd = 0;
    for (const [day, ds] of DATA.events) { if (day <= simDay) { fd++; dd += ds.length; } else break; }
    $("s1").textContent = fd.toLocaleString(STR.locale); $("s2").textContent = dd.toLocaleString(STR.locale);
  }
  document.querySelector(".stats").style.visibility = inWorst ? "hidden" : "visible";
  $("progress").firstElementChild.style.width = (inWorst ? DATA.worstDay / DATA.totalDays : play) * 100 + "%";
  $("legend").style.opacity = (t >= T_PLAY0 - .8 && t < T_PLAY1) ? clamp((t - T_PLAY0 + .8) / .8) : 0;

  // top-10 bars
  $("bars").style.visibility = inTop ? "visible" : "hidden";
  bars.forEach((b, j) => { b.style.opacity = inTop ? ease((t - T_WORST1 - .3 - j * .12) / .5) : 0; });
  fills.forEach((f, j) => { f.style.width = (inTop ? ease((t - T_WORST1 - .3 - j * .12) / 1.2) : 0) * ranked[j].n / ranked[0].n * 100 + "%";
    f.style.background = scale(ranked[j].n); });

  // closing
  const c = $("closing");
  if (inEnd) {
    c.innerHTML = STR.closing(DATA.districts.length - DATA.zeroDistricts.length, DATA.districts.length);
    c.style.opacity = ease((t - T_TOP1 - .3) / .8);
  } else c.style.opacity = 0;
}
window.renderAt = renderAt;
window.DURATION = DUR;

function fit() {
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  $("stage").style.transform = `scale(${s})`;
}
if (!new URLSearchParams(location.search).has("render")) {
  addEventListener("resize", fit); fit();
  let t0 = null;
  const loop = (now) => { if (t0 === null) t0 = now; renderAt(((now - t0) / 1000) % (DUR + 2)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
} else renderAt(0);
</script>
</body>
