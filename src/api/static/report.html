<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1565c0">
<title>รายงานน้ำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#555; --card:#f4f6f8; --line:#d0d5da; --accent:#1565c0; --onaccent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --fg:#f1f3f5; --muted:#b0b6bc; --card:#1e2227; --line:#3a4048; --accent:#64b5f6; --onaccent:#0b1a2a; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"Sarabun", system-ui, sans-serif; font-size:20px; line-height:1.45; }
  main { max-width:560px; margin:0 auto; padding:16px; min-height:100%; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:4px 0 0; font-size:1.5rem; }
  .step { color:var(--muted); font-size:1rem; }
  .levels { display:flex; flex-direction:column; gap:12px; }
  .lv { display:flex; align-items:center; gap:16px; width:100%; min-height:76px; padding:12px 18px; border-radius:16px;
    border:3px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:1.3rem; font-weight:700;
    text-align:left; cursor:pointer; }
  .lv .e { font-size:2.2rem; }
  .lv:focus-visible, .big:focus-visible { outline:4px solid var(--accent); outline-offset:2px; }
  #mapwrap { position:relative; height:55vh; min-height:300px; border-radius:16px; overflow:hidden; border:2px solid var(--line); }
  #map { position:absolute; inset:0; }
  .crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-100%); z-index:500; font-size:44px;
    pointer-events:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .big { width:100%; min-height:64px; border-radius:16px; border:none; background:var(--accent); color:var(--onaccent);
    font:inherit; font-size:1.3rem; font-weight:700; cursor:pointer; }
  .big.secondary { background:transparent; color:var(--accent); border:3px solid var(--accent); }
  .big:disabled { opacity:.5; }
  .chosen { font-size:1.2rem; font-weight:700; }
  .msg { padding:14px 16px; border-radius:14px; background:var(--card); }
  .note { color:var(--muted); font-size:.9rem; }
  .done { text-align:center; font-size:1.3rem; }
  .done .e { font-size:4rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>🌊 รายงานน้ำ</h1>
    <div class="step" id="stepText">ขั้นที่ 1 จาก 2: น้ำถึงไหนแล้ว?</div>
  </header>

  <section id="s-level">
    <div class="levels" id="levels" role="list"></div>
  </section>

  <section id="s-place" hidden>
    <div class="chosen" id="chosen"></div>
    <div class="msg">เลื่อนแผนที่ให้ <b>📍 หมุด</b> อยู่ตรงจุดที่เห็นน้ำ</div>
    <div id="mapwrap"><div id="map"></div><div class="crosshair" aria-hidden="true">📍</div></div>
    <button class="big secondary" id="gps" type="button">🎯 ไปที่ตำแหน่งของฉัน</button>
    <button class="big" id="send" type="button">ส่งรายงาน</button>
    <button class="big secondary" id="back" type="button">← เลือกระดับน้ำใหม่</button>
  </section>

  <section id="s-done" class="done" hidden>
    <div class="e">🙏</div>
    <p id="doneText">ขอบคุณครับ</p>
    <button class="big" id="toMap" type="button">🗺️ ดูแผนที่น้ำท่วม</button>
    <p></p>
    <button class="big secondary" id="close" type="button">ปิด</button>
  </section>

  <div class="msg" id="error" role="alert" hidden></div>
  <p class="note">รายงานของคุณจะขึ้นแผนที่สาธารณะ 3 ชั่วโมง โดยไม่แสดงชื่อ · ตำแหน่งถูกปัดให้หยาบลงราว 100 เมตร ·
    ข้อมูลเป็นรายงานจากประชาชน ยังไม่ได้ตรวจสอบโดยหน่วยงาน</p>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let levels = [], picked = null, map = null;

function showError(t) { $("error").textContent = t; $("error").hidden = !t; }
function show(step) {
  for (const s of ["s-level", "s-place", "s-done"]) $(s).hidden = s !== step;
  $("stepText").textContent = step === "s-level" ? "ขั้นที่ 1 จาก 2: น้ำถึงไหนแล้ว?"
    : step === "s-place" ? "ขั้นที่ 2 จาก 2: น้ำอยู่ตรงไหน?" : "ส่งแล้ว";
  window.scrollTo(0, 0);
}

function drawLevels() {
  const box = $("levels");
  box.replaceChildren();
  for (const lv of [...levels].sort((a, b) => b.rank - a.rank)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "lv"; b.setAttribute("role", "listitem");
    b.style.borderColor = lv.color;
    const e = document.createElement("span"); e.className = "e"; e.textContent = lv.emoji;
    const t = document.createElement("span"); t.textContent = lv.label;
    b.append(e, t);
    b.addEventListener("click", () => pick(lv));
    box.append(b);
  }
}

function pick(lv) {
  picked = lv;
  $("chosen").textContent = `${lv.emoji} ${lv.label}`;
  show("s-place");
  if (!map) {
    map = L.map("map", { zoomControl: true }).setView([13.75, 100.52], 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
    locate();
  }
  setTimeout(() => map.invalidateSize(), 50);
}

function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (p) => map.setView([p.coords.latitude, p.coords.longitude], 17),
    () => showError("เปิดตำแหน่งไม่ได้ ลองเลื่อนแผนที่ไปยังจุดที่เห็นน้ำเองได้เลย"),
    { enableHighAccuracy: true, timeout: 10000 });
}

async function send() {
  showError("");
  $("send").disabled = true; $("send").textContent = "กำลังส่ง...";
  const c = map.getCenter();
  try {
    const res = await fetch("/v1/reports", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (liff.getIDToken() || "") },
      body: JSON.stringify({ level: picked.key, location: { lat: c.lat, lon: c.lng } }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 429) return showError("ชั่วโมงนี้คุณรายงานครบแล้ว ขอบคุณมากครับ ลองใหม่ภายหลังได้");
    if (res.status === 401) { liff.login({ redirectUri: location.href }); return; }
    if (!res.ok) return showError("ส่งไม่สำเร็จ ลองใหม่อีกครั้ง");
    if (body.status === "outside_bangkok") return showError("ตอนนี้รับรายงานเฉพาะในกรุงเทพฯ ก่อนครับ");
    $("doneText").textContent = `ขอบคุณครับ รายงาน "${picked.emoji} ${picked.label}" เขต${body.district} ขึ้นแผนที่แล้ว ช่วยให้เพื่อนบ้านเลี่ยงน้ำได้`;
    show("s-done");
  } catch (e) {
    showError("ไม่มีอินเทอร์เน็ต ลองใหม่อีกครั้ง");
  } finally {
    $("send").disabled = false; $("send").textContent = "ส่งรายงาน";
  }
}

$("gps").addEventListener("click", locate);
$("send").addEventListener("click", send);
$("back").addEventListener("click", () => show("s-level"));
$("toMap").addEventListener("click", () => { location.href = "/map"; });
$("close").addEventListener("click", () => (liff.isInClient() ? liff.closeWindow() : (location.href = "/map")));

(async () => {
  try {
    const [cfg, data] = await Promise.all([
      fetch("/v1/public/app-config").then((r) => r.json()),
      fetch("/v1/public/reports").then((r) => r.json()),
    ]);
    levels = data.levels; drawLevels();
    if (!cfg.liff_id) {
      $("s-level").hidden = true;
      return showError("ยังไม่เปิดให้รายงานผ่านหน้านี้ ใช้แชท LINE พิมพ์ \"รายงานน้ำ\" แทนได้ครับ");
    }
    await liff.init({ liffId: cfg.liff_id });
    if (!liff.isLoggedIn()) liff.login({ redirectUri: location.href });
  } catch (e) {
    showError("โหลดไม่สำเร็จ ลองเปิดใหม่อีกครั้ง");
  }
})();
</script>
</body>
</html>
